name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rally-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake g++ libopencv-dev
      - run: python -m pip install ./workers/rally-detection
      - run: cmake -S workers/rally-detection/native/court-detection -B /tmp/mintonix-court-build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build /tmp/mintonix-court-build --parallel 2
      - run: python -m unittest discover -s workers/rally-detection/tests -v
        env:
          MINTONIX_COURT_DETECTOR: /tmp/mintonix-court-build/mintonix-court-detect
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
